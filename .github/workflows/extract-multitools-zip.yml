name: Extract multitools ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-multitools-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="multitools Any to Any Img.zip"
          test -f "$ZIP_FILE"

          rm -rf .zip-extract
          mkdir -p .zip-extract
          unzip -q -o "$ZIP_FILE" -d .zip-extract

          rsync -a --exclude=".git/" .zip-extract/ ./
          rm -rf .zip-extract

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract multitools Any to Any Img ZIP"
          git push
